name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags-ignore: ['**']
permissions:
  contents: write
env:
  SINGBOX_TAG: v1.11.4
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack the newest SOURCE zip (the one that contains app/build.gradle.kts)
        run: |
          best=""; bt=-1
          for f in *.zip; do
            [ -f "$f" ] || continue
            if unzip -Z1 "$f" 2>/dev/null | grep -qx 'app/build.gradle.kts'; then
              t=$(git log -1 --format=%ct -- "$f" 2>/dev/null); t=${t:-0}
              echo "found source zip: $f (commit time $t)"
              if [ "$t" -ge "$bt" ]; then bt=$t; best="$f"; fi
            else
              echo "skip (not a source zip): $f"
            fi
          done
          if [ -n "$best" ]; then echo "USING $best"; unzip -o "$best" -d . ; else echo "no source zip found"; fi
          ls -la
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Build libbox (sing-box core for Android)
        run: |
          git clone --depth 1 --branch "$SINGBOX_TAG" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          GM=$(grep -o 'gomobile/cmd/gomobile@v[0-9.]*' Makefile | head -1)
          GB=$(grep -o 'gomobile/cmd/gobind@v[0-9.]*' Makefile | head -1)
          go install -v github.com/sagernet/$GM
          go install -v github.com/sagernet/$GB
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          go run ./cmd/internal/build_libbox -target android
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
      - name: Stamp build id
        run: echo "BUILD_ID=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VpnHub-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release (for auto-update inside the app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"id\":\"$BUILD_ID\"}" > latest.json
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest app-debug.apk latest.json --title "Android build $BUILD_ID" --notes "Автосборка для автообновления в приложении" --target "${{ github.sha }}"
